apiVersion: apps/v1
kind: Deployment
metadata: { name: mcp-server, namespace: {{ .Values.namespace }} }
spec:
  replicas: 2
  selector: { matchLabels: { app: mcp-server } }
  template:
    metadata:
      labels:
        app: mcp-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "{{ .Values.mcp_server.port }}"
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: mcp-server
          image: "{{ .Values.mcp_server.image.repository }}:{{ .Values.mcp_server.image.tag }}"
          imagePullPolicy: "{{ .Values.mcp_server.image.pullPolicy }}"
          env:
            - name: PORT
              value: "{{ .Values.mcp_server.port }}"
            - name: SURREALDB_HOST
              value: {{ .Values.surrealdb.host | quote }}
            - name: SURREALDB_PORT
              value: {{ .Values.surrealdb.port | quote }}
            - name: SURREALDB_NS
              value: {{ .Values.surrealdb.namespace | quote }}
            - name: SURREALDB_DB
              value: {{ .Values.surrealdb.database | quote }}
            - name: SURREALDB_USER
              valueFrom: { secretKeyRef: { name: surreal-secret, key: user } }
            - name: SURREALDB_PASS
              valueFrom: { secretKeyRef: { name: surreal-secret, key: pass } }
            - name: GITHUB_REPO
              value: {{ .Values.github.repo | quote }}
            - name: GITHUB_REPO_OWNER
              value: {{ .Values.github.repoOwner | quote }}
            - name: GITHUB_REPO_NAME
              value: {{ .Values.github.repoName | quote }}
            - name: GITHUB_TOKEN
              valueFrom: { secretKeyRef: { name: github-secret, key: apiKey } }
            - name: LLM_API_KEY
              valueFrom: { secretKeyRef: { name: openai-secret, key: apiKey } }
            - name: SLACK_API_KEY
              valueFrom: { secretKeyRef: { name: slack-secret, key: apiKey } }
            - name: SLACK_RELAY_ENDPOINT
              value: {{ .Values.slack.relayEndpoint | quote }}
          ports: [ { containerPort: {{ .Values.mcp_server.port }} } ]
---
apiVersion: v1
kind: Service
metadata: { name: mcp-server, namespace: {{ .Values.namespace }} }
spec:
  selector: { app: mcp-server }
  ports: [ { port: 80, targetPort: {{ .Values.mcp_server.port }} } ]
